name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check . --output-format=github
      - name: requirements.txt matches uv.lock (used by Streamlit Community Cloud)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -q -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt) \
            || { echo "::error::requirements.txt is stale: run the uv export command at its top"; exit 1; }
      - name: Run tests with coverage (no API key, no network)
        run: |
          uv run pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md
          { echo "### Test coverage"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [0_state, 1_app, 2_cicd]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false
        working-directory: terraform/${{ matrix.module }}
      - run: terraform validate
        working-directory: terraform/${{ matrix.module }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: deepeval-agent-refund:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
