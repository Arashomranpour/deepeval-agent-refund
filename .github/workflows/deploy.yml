name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app_pages/**"
      - "agent/**"
      - "evaluations/**"
      - ".streamlit/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure, no stored password
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: deepeval-agent-refund

jobs:
  deploy:
    # Skips (not fails) until terraform/2_cicd is applied and its variables are set.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Tests must pass before shipping
        run: uv sync --locked && uv run pytest -q

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow az CLI extensions without prompts
        run: az config set extension.use_dynamic_install=yes_without_prompt

      # Built on the runner and pushed: ACR Tasks (`az acr build`) are often
      # disabled on Azure for Students subscriptions.
      - name: Log in to the registry
        id: acr
        run: |
          echo "server=$(az acr show --name '${{ vars.AZURE_ACR_NAME }}' --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out new revision
        run: |
          # Terraform starts the app on a placeholder image (port 80); Streamlit listens on 8501.
          az containerapp ingress update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --target-port 8501
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Smoke test
        id: url
        run: |
          FQDN=$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "app_url=https://$FQDN" >> "$GITHUB_OUTPUT"
          # Scale-to-zero apps need a few seconds to wake up.
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/_stcore/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "Health check failed" && exit 1
