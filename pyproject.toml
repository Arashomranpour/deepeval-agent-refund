[project]
name = "langchain-agent-evaluation-system"
version = "0.1.0"
description = "LangChain refund agent on Groq, evaluated with DeepEval, with a Streamlit app and Azure deployment"
readme = "README.md"
authors = [
    { name = "Mohamad-Hachem", email = "mohamad27hachem@outlook.com" },
    { name = "Arash Omranpour", email = "arashomranpour@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncio>=4.0.0",
    "deepeval[inspect]>=4.2.8",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "portalocker[win32]>=4.4.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
langchain-agent-evaluation-system = "langchain_agent_evaluation_system:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
